[project]
name = "tests"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "anyio>=4.9.0",
    "deepeval>=1.0.0",
    "litellm>=1.84.0,<1.85",
    "mcp>=1.9.3",
    "pytest>=9.0.3",
    "pytest-rerunfailures>=15.0",
    "python-dotenv>=1.2.2",
]

[tool.pytest.ini_options]
addopts = "-p no:flaky"
